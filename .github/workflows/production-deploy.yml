name: Production Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP_DIR: Nova pasta
  FUNCTIONS_DIR: Nova pasta/functions
  FIREBASE_PROJECT_ID: ciclo-plus-f9c8f
  VITE_BACKEND_BASE_URL: https://us-central1-ciclo-plus-f9c8f.cloudfunctions.net/api
  VITE_USE_FIREBASE_EMULATORS: "false"
  SETTLEMENT_PROVIDER: FIRESTORE_LEDGER
  VITE_FIREBASE_PROJECT_ID: ciclo-plus-f9c8f
  VITE_FIREBASE_STORAGE_BUCKET: ciclo-plus-f9c8f.firebasestorage.app
  VITE_FIREBASE_API_KEY: AIzaSyD-8rkmAkxCjrx2uDzOjshiq_83x8M7o7g
  VITE_FIREBASE_AUTH_DOMAIN: ciclo-plus-f9c8f.firebaseapp.com
  VITE_FIREBASE_MESSAGING_SENDER_ID: "1086183568033"
  VITE_FIREBASE_APP_ID: 1:1086183568033:web:c5f5e9b27c9bba7416f6e0
  SUPPORT_MODULE_ERP_CORE_BASE_URL: ${{ vars.SUPPORT_MODULE_ERP_CORE_BASE_URL || vars.VITE_BACKEND_BASE_URL || env.VITE_BACKEND_BASE_URL }}
  SUPPORT_MODULE_ERP_CORE_ENVIRONMENT: ${{ vars.SUPPORT_MODULE_ERP_CORE_ENVIRONMENT || 'PRODUCAO' }}
  SUPPORT_MODULE_ERP_CORE_AUTH_MODE: ${{ vars.SUPPORT_MODULE_ERP_CORE_AUTH_MODE || 'NONE' }}
  SUPPORT_MODULE_ERP_CORE_ENABLED: ${{ vars.SUPPORT_MODULE_ERP_CORE_ENABLED || 'true' }}
  SUPPORT_MODULE_ERP_CORE_MANIFEST_PATH: ${{ vars.SUPPORT_MODULE_ERP_CORE_MANIFEST_PATH || '/v1/support/manifest' }}
  SUPPORT_MODULE_MPV_CICLO_BASE_URL: ${{ vars.SUPPORT_MODULE_MPV_CICLO_BASE_URL || 'https://us-central1-ciclo-plus-f9c8f.cloudfunctions.net/mpvCicloApi' }}
  SUPPORT_MODULE_MPV_CICLO_ENVIRONMENT: ${{ vars.SUPPORT_MODULE_MPV_CICLO_ENVIRONMENT || 'PRODUCAO' }}
  SUPPORT_MODULE_MPV_CICLO_ENABLED: ${{ vars.SUPPORT_MODULE_MPV_CICLO_ENABLED || 'true' }}
  SUPPORT_MODULE_MPV_CICLO_AUTH_MODE: ${{ vars.SUPPORT_MODULE_MPV_CICLO_AUTH_MODE || 'NONE' }}
  SUPPORT_MODULE_MPV_CICLO_HEALTH_PATH: ${{ vars.SUPPORT_MODULE_MPV_CICLO_HEALTH_PATH || '/healthz' }}
  SUPPORT_MODULE_MPV_CICLO_MANIFEST_PATH: ${{ vars.SUPPORT_MODULE_MPV_CICLO_MANIFEST_PATH || '/manifest' }}
  SUPPORT_MODULE_MPV_CICLO_CAPABILITIES: ${{ vars.SUPPORT_MODULE_MPV_CICLO_CAPABILITIES || 'smartpos-webhook,pricing-lock,erp-forwarding,scheduler-retry' }}
  SUPPORT_MODULE_CEREBRO_NEXUS_BASE_URL: ${{ vars.SUPPORT_MODULE_CEREBRO_NEXUS_BASE_URL }}
  SUPPORT_MODULE_CEREBRO_NEXUS_ENVIRONMENT: ${{ vars.SUPPORT_MODULE_CEREBRO_NEXUS_ENVIRONMENT || 'PRODUCAO' }}
  SUPPORT_MODULE_CEREBRO_NEXUS_ENABLED: ${{ vars.SUPPORT_MODULE_CEREBRO_NEXUS_ENABLED || 'false' }}
  SUPPORT_MODULE_CEREBRO_NEXUS_AUTH_MODE: ${{ vars.SUPPORT_MODULE_CEREBRO_NEXUS_AUTH_MODE || 'NONE' }}
  SUPPORT_MODULE_CEREBRO_NEXUS_HEALTH_PATH: ${{ vars.SUPPORT_MODULE_CEREBRO_NEXUS_HEALTH_PATH || '/health' }}
  SUPPORT_MODULE_CEREBRO_NEXUS_MANIFEST_PATH: ${{ vars.SUPPORT_MODULE_CEREBRO_NEXUS_MANIFEST_PATH || '/manifest' }}
  SUPPORT_MODULE_CEREBRO_NEXUS_CAPABILITIES: ${{ vars.SUPPORT_MODULE_CEREBRO_NEXUS_CAPABILITIES || 'governance-engine,evidence-validation,audit-export,signal-fusion' }}
  SUPPORT_MODULE_NEXUS_GATEWAY_URL: ${{ vars.SUPPORT_MODULE_NEXUS_GATEWAY_URL }}

jobs:
  deploy:
    name: Deploy Firebase Production
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://ciclo-plus-f9c8f.web.app

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: Nova pasta/package-lock.json

      - name: Validate latest main tip
        run: |
          git fetch origin main
          LOCAL_SHA="$(git rev-parse HEAD)"
          REMOTE_SHA="$(git rev-parse origin/main)"
          if [ "$LOCAL_SHA" != "$REMOTE_SHA" ]; then
            echo "Outdated run: $LOCAL_SHA != $REMOTE_SHA"
            exit 1
          fi

      - name: Validate strict Firebase real mode
        run: node scripts/verify-firebase-real-mode.mjs

      - name: Validate production environment contract
        run: node scripts/verify-production-env.mjs

      - name: Install web dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm ci

      - name: Web typecheck
        working-directory: ${{ env.APP_DIR }}
        run: npm run typecheck

      - name: Build web app
        working-directory: ${{ env.APP_DIR }}
        run: npm run build

      - name: Install functions dependencies
        working-directory: ${{ env.FUNCTIONS_DIR }}
        run: npm install

      - name: Build functions
        working-directory: ${{ env.FUNCTIONS_DIR }}
        run: npm run build

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Validate deploy credentials
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN || vars.FIREBASE_TOKEN }}
        run: |
          if [ -z "${FIREBASE_TOKEN}" ]; then
            echo "Missing required repository secret: FIREBASE_TOKEN"
            exit 1
          fi

      - name: Deploy hosting, APIs, kernel functions, and Firebase rules/indexes
        working-directory: ${{ env.APP_DIR }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN || vars.FIREBASE_TOKEN }}
        run: |
          firebase deploy \
            --project "${FIREBASE_PROJECT_ID}" \
            --only "hosting,functions:api,functions:agroApi,functions:marketApi,functions:supportApi,functions:mpvCicloApi,functions:secureConfirmInboundEntry,functions:secureRegisterStockLoss,functions:adminSetUserClaims,functions:adminUpsertPublicMarketPoint,functions:recomputePublicInputCostIndexDaily,functions:refreshPublicExternalMarketData,functions:nexusObserveAuditLog,functions:supportModulesHealthHeartbeat,firestore:rules,firestore:indexes,storage" \
            --token "${FIREBASE_TOKEN}"

      - name: Smoke test production endpoints
        env:
          GO_LIVE_WEB_URL: https://${{ env.FIREBASE_PROJECT_ID }}.web.app
          GO_LIVE_API_BASE_URL: https://us-central1-${{ env.FIREBASE_PROJECT_ID }}.cloudfunctions.net/api
          GO_LIVE_AGRO_BASE_URL: https://us-central1-${{ env.FIREBASE_PROJECT_ID }}.cloudfunctions.net/agroApi
          GO_LIVE_MARKET_HEALTH_URL: https://us-central1-${{ env.FIREBASE_PROJECT_ID }}.cloudfunctions.net/api/v1/market/health
          GO_LIVE_MARKET_SUMMARY_URL: https://us-central1-${{ env.FIREBASE_PROJECT_ID }}.cloudfunctions.net/api/v1/public/market/summary
          GO_LIVE_SUPPORT_MANIFEST_URL: https://us-central1-${{ env.FIREBASE_PROJECT_ID }}.cloudfunctions.net/api/v1/support/manifest
        run: node scripts/go-live-smoke.mjs
