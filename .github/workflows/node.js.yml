name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Nova pasta
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: Nova pasta/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build web app
        run: npm run build

  functions:
    name: Functions Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Nova pasta/functions
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install dependencies
        run: npm install

      - name: Build functions
        run: npm run build

  smoke:
    name: Emulator Smoke
    runs-on: ubuntu-latest
    needs: [web, functions]
    defaults:
      run:
        working-directory: Nova pasta
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: Nova pasta/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Validate Firebase real-mode guard
        run: node ../scripts/verify-firebase-real-mode.mjs

      - name: Firestore/Auth emulator smoke
        run: npx firebase-tools emulators:exec --project ciclo-plus-local --only auth,firestore "echo FIRESTORE_AUTH_SMOKE_OK"
    
